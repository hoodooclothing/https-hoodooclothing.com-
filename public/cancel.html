<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Cancelled &mdash; HOODOO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <span class="announcement-msg active">New Collection &mdash; Shop Now</span>
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="logo">
        <span class="hoodoo-mark">
          <span class="hd-pre">H</span>
          <span class="hd-vesica" aria-hidden="true">
            <span class="hd-ring hd-l"></span>
            <span class="hd-ring hd-r"></span>
            <span class="hd-lens"></span>
          </span>
          <span class="hd-post">Doo</span>
        </span>
      </a>
    </div>
  </nav>

  <main class="status-page">
    <div class="status-icon-animated cancel">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" class="status-x"/>
        <line x1="6" y1="6" x2="18" y2="18" class="status-x"/>
      </svg>
    </div>
    <h1>Order Cancelled</h1>
    <p>Your payment was not completed. No charges were made. Your items are still in your cart if you'd like to try again.</p>

    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
      <a href="/" class="btn btn-primary">Back to Shop</a>
      <a href="/" class="btn btn-secondary" onclick="document.dispatchEvent(new Event('open-cart'));return true;">View Cart</a>
    </div>
  </main>

  <footer class="footer-rich" style="margin-top:auto;">
    <div class="footer-bottom">
      <p>&copy; 2026 Hoodoo Clothing. All rights reserved.</p>
    </div>
  </footer>

  <script src="analytics.js"></script>
</body>
</html>
