<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product &mdash; HOODOO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Free Shipping Banner -->
  <div class="shipping-banner">Free Shipping on All Orders</div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="logo">
        <span class="hoodoo-mark">
          <span class="hd-pre">H</span>
          <span class="hd-vesica" aria-hidden="true">
            <span class="hd-ring hd-l"></span>
            <span class="hd-ring hd-r"></span>
            <span class="hd-lens"></span>
          </span>
          <span class="hd-post">Doo</span>
        </span>
      </a>
      <ul class="nav-links">
        <li><a href="/#products">Shop</a></li>
        <li><a href="/#about">About</a></li>
        <li>
          <button class="cart-btn" id="cart-btn">
            Cart (<span id="cart-count">0</span>)
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Product Detail -->
  <main class="pdp-container" id="pdp-container">
    <div class="pdp-loading">Loading product...</div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Product image" />
  </div>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="cart-close" id="cart-close">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p class="cart-empty">Your cart is empty.</p>
    </div>
    <div class="cart-footer" id="cart-footer" style="display:none;">
      <div class="cart-total">
        Total: <span id="cart-total">$0</span>
      </div>
      <button class="btn btn-primary btn-full" id="checkout-btn">Checkout</button>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Hoodoo Clothing. All rights reserved.</p>
  </footer>

  <script src="analytics.js"></script>
  <script src="product.js"></script>
</body>
</html>
