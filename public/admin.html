<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders &mdash; NOIR Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="logo">NOIR</a>
      <ul class="nav-links">
        <li><a href="/">Storefront</a></li>
        <li><a href="/admin.html" style="color: var(--text);">Orders</a></li>
      </ul>
    </div>
  </nav>

  <main class="admin-container">
    <div class="admin-header">
      <h1>Tapstitch Fulfillment Queue</h1>
      <button class="btn btn-secondary btn-sm" id="refresh-btn">Refresh</button>
    </div>
    <div id="orders-list">
      <div class="empty-state">Loading orders...</div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 NOIR. All rights reserved.</p>
  </footer>

  <script>
    const ordersList = document.getElementById("orders-list");
    const refreshBtn = document.getElementById("refresh-btn");

    const STATUS_LABELS = {
      pending_fulfillment: "Pending",
      submitted_to_tapstitch: "Submitted",
      in_production: "In Production",
      shipped: "Shipped",
      delivered: "Delivered",
    };

    const STATUS_BADGES = {
      pending_fulfillment: "badge-pending",
      submitted_to_tapstitch: "badge-submitted",
      in_production: "badge-production",
      shipped: "badge-shipped",
      delivered: "badge-delivered",
    };

    async function loadOrders() {
      try {
        const res = await fetch("/admin/orders");
        const orders = await res.json();

        if (orders.length === 0) {
          ordersList.innerHTML = '<div class="empty-state">No orders yet. Orders will appear here after a successful Stripe payment.</div>';
          return;
        }

        ordersList.innerHTML = orders.map((order) => {
          const shipping = order.shipping;
          const addr = shipping?.address;
          const addrStr = addr
            ? [addr.line1, addr.line2, `${addr.city}, ${addr.state} ${addr.postal_code}`, addr.country].filter(Boolean).join("<br>")
            : "Not provided";

          const itemRows = order.items
            .map(
              (item) => `<tr>
                <td>${item.name}</td>
                <td>${item.quantity}</td>
                <td>$${(item.total / 100).toFixed(2)}</td>
              </tr>`
            )
            .join("");

          const tapstitchInfo = order.tapstitchMeta
            ? order.tapstitchMeta
                .map(
                  (m) => `<p>${m.name} &mdash; ${m.color || "N/A"} / ${m.size || "N/A"} &mdash; Qty: ${m.quantity} &mdash; Print: ${m.printMethod || "dtg"}<br><small>Tapstitch ID: ${m.tapstitchProductId || "N/A"} &bull; Type: ${m.productType || "N/A"}</small></p>`
                )
                .join("")
            : "<p>No Tapstitch metadata (order placed before integration)</p>";

          return `
            <div class="order-card">
              <div class="order-top">
                <span class="order-id">${order.id}</span>
                <span class="badge ${STATUS_BADGES[order.status] || "badge-pending"}">${STATUS_LABELS[order.status] || order.status}</span>
                <span class="order-date">${new Date(order.createdAt).toLocaleString()}</span>
              </div>

              <div class="order-grid">
                <div class="order-section">
                  <h4>Customer</h4>
                  <p>${order.customer?.name || "N/A"}<br>${order.customer?.email || "N/A"}<br>${order.customer?.phone || ""}</p>
                </div>
                <div class="order-section">
                  <h4>Ship To</h4>
                  <p>${shipping?.name || ""}<br>${addrStr}</p>
                </div>
              </div>

              <table class="order-items-table">
                <thead>
                  <tr><th>Item</th><th>Qty</th><th>Total</th></tr>
                </thead>
                <tbody>${itemRows}</tbody>
              </table>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <strong>Total: $${(order.amountTotal / 100).toFixed(2)} ${order.currency?.toUpperCase() || "USD"}</strong>
              </div>

              <div class="tapstitch-meta">
                <h4>Tapstitch Fulfillment Details</h4>
                ${tapstitchInfo}
              </div>

              <div class="order-actions" style="margin-top:16px;">
                <select data-order-id="${order.id}">
                  <option value="pending_fulfillment" ${order.status === "pending_fulfillment" ? "selected" : ""}>Pending</option>
                  <option value="submitted_to_tapstitch" ${order.status === "submitted_to_tapstitch" ? "selected" : ""}>Submitted to Tapstitch</option>
                  <option value="in_production" ${order.status === "in_production" ? "selected" : ""}>In Production</option>
                  <option value="shipped" ${order.status === "shipped" ? "selected" : ""}>Shipped</option>
                  <option value="delivered" ${order.status === "delivered" ? "selected" : ""}>Delivered</option>
                </select>
                <button class="btn btn-primary btn-sm update-status-btn" data-order-id="${order.id}">Update Status</button>
              </div>
            </div>
          `;
        }).join("");

        // Bind status update buttons
        document.querySelectorAll(".update-status-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const orderId = btn.dataset.orderId;
            const select = document.querySelector(`select[data-order-id="${orderId}"]`);
            const status = select.value;

            try {
              await fetch(`/admin/orders/${orderId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status }),
              });
              loadOrders();
            } catch (err) {
              alert("Failed to update order status.");
            }
          });
        });
      } catch (err) {
        ordersList.innerHTML = '<div class="empty-state">Failed to load orders. Is the server running?</div>';
      }
    }

    refreshBtn.addEventListener("click", loadOrders);
    loadOrders();
  </script>
</body>
</html>
